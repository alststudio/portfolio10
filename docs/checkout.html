<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Checkout — HINA Lemari Kecil</title>
<meta name="description" content="Checkout demo HINA — simulasi, tidak ada pembayaran nyata.">
<link rel="icon" href="data:,">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/responsive.css">
</head>
<body data-page="checkout">
<header class="site-header" id="siteHeader"></header>
<main>
  <div class="page-head wrap">
    <h1>Checkout</h1>
    <p>Halaman demo — pembayaran bersifat simulasi.</p>
  </div>
  <section class="wrap" style="padding-bottom:96px">
    <form id="checkoutForm" novalidate>
      <div class="cart-layout">
        <div class="form-card" style="margin:0;max-width:none">
          <h2>Data Pengiriman</h2>
          <label class="f-label" for="coName">Nama lengkap</label>
          <input type="text" id="coName" required>
          <label class="f-label" for="coEmail">Email</label>
          <input type="email" id="coEmail" required>
          <label class="f-label" for="coPhone">Nomor telepon</label>
          <input type="tel" id="coPhone" required>
          <label class="f-label" for="coAddress">Alamat</label>
          <textarea id="coAddress" rows="3" required></textarea>
          <label class="f-label" for="coCity">Kota</label>
          <input type="text" id="coCity" required>
          <label class="f-label" for="coZip">Kode pos</label>
          <input type="text" id="coZip" required>
          <label class="f-label">Metode pembayaran (simulasi)</label>
          <div class="radio-row">
            <label><input type="radio" name="pay" value="Transfer Bank" checked> Transfer Bank</label>
            <label><input type="radio" name="pay" value="E-Wallet"> E-Wallet</label>
            <label><input type="radio" name="pay" value="COD"> COD (bayar di tempat)</label>
          </div>
        </div>
        <div class="summary-card">
          <h3>Ringkasan Pesanan</h3>
          <ul id="checkoutItems"></ul>
          <div id="checkoutSummary"></div>
          <div class="voucher-row">
            <input type="text" id="voucherInput" placeholder="Kode voucher (coba HINA10)">
            <button class="btn btn-small" type="button" id="applyVoucher">Pakai</button>
          </div>
          <p class="form-msg" id="voucherMsg"></p>
          <p class="form-msg" id="checkoutError"></p>
          <button class="btn btn-dark btn-block" type="submit">Buat Pesanan</button>
        </div>
      </div>
    </form>
  </section>
</main>
<footer class="site-footer" id="siteFooter"></footer>
<script src="js/products.js"></script>
<script src="js/cart.js"></script>
<script src="js/components.js"></script>
<script src="js/app.js"></script>
<script src="js/checkout.js"></script>
</body>
</html>
