<!DOCTYPE html>

<main>

    <h1>Masuk</h1>
    <p>Akun demo — kata sandi tidak pernah disimpan.</p>
  </div>

    <form class="form-card" id="loginForm">
      <h2>Selamat Datang Kembali</h2>
      <label class="f-label" for="loginEmail">Email</label>

      <button class="btn btn-dark btn-block" type="submit">Masuk</button>
      <p class="form-msg" id="loginMsg"></p>
      <p class="form-note"><a href="#" id="forgotLink">Lupa kata sandi?</a> · Belum punya akun? <a href="daftar.html">Daftar</a></p>
