<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Daftar — HINA Lemari Kecil</title>
<meta name="description" content="Buat akun demo HINA.">
<link rel="icon" href="data:,">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/responsive.css">
</head>
<body data-page="daftar">
<header class="site-header" id="siteHeader"></header>
<main>
  <div class="page-head wrap">
    <h1>Daftar</h1>
    <p>Akun demo — hanya nama dan email yang disimpan di peramban kamu.</p>
  </div>
  <section class="wrap" style="padding-bottom:96px">
    <form class="form-card" id="registerForm">
      <h2>Buat Akun</h2>
      <label class="f-label" for="regName">Nama</label>
      <input type="text" id="regName" required>
      <label class="f-label" for="regEmail">Email</label>
      <input type="email" id="regEmail" required>
      <label class="f-label" for="regPass">Kata sandi</label>
      <input type="password" id="regPass" required>
      <button class="btn btn-dark btn-block" type="submit">Daftar</button>
      <p class="form-msg" id="regMsg"></p>
      <p class="form-note">Sudah punya akun? <a href="masuk.html">Masuk</a></p>
    </form>
  </section>
</main>
<footer class="site-footer" id="siteFooter"></footer>
<script src="js/products.js"></script>
<script src="js/cart.js"></script>
<script src="js/components.js"></script>
<script src="js/app.js"></script>
</body>
</html>
